project:
  type: website
  preview:
    port: 4323
  render:
    - "*.qmd"
    - "!_data/*.pdf"
    - "!_data/*.epub"
execute:
  freeze: auto
  message: false
  warning: false
website:
  title: "SPA 379 · El español en perspectiva tipológica"
  site-url: https://francojc.github.io/spa379/
  description: "Seminario de lingüística hispánica: tipología, variación y contacto del español (WFU, Spring 2027)."
  open-graph: true
  search:
    location: navbar
    type: overlay
  navbar:
    left:
      - index.qmd
      - horario.qmd
      - text: "<i class='fa-solid fa-book-open' aria-hidden='true'></i> Contenido"
        menu:
          - planes.qmd
          - diapositivas.qmd
          - gramatica.qmd
          - materiales.qmd
          - actividades.qmd
    right:
      - strategies.qmd
format:
  html:
    link-external-newwindow: true
    theme:
      light: cosmo
      dark: darkly
    css:
      - styles.css
      - include/webex.css
    toc: true
    toc-depth: 3
    include-after-body: include/webex.js
lang: es
